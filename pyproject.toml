[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian-ai"
version = "0.1.0"
description = "GUARDIAN — A Responsible Agent Runtime for AI agents. Trace, diagnose, and auto-remediate agent failures."
readme = "PHASE1_README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "GUARDIAN Contributors"},
]
keywords = ["ai", "agents", "observability", "tracing", "responsible-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
ethics = [
    "spacy>=3.7",
    "litellm>=1.0",
]


[project.urls]
Homepage = "https://github.com/guardian-ai/guardian"
Repository = "https://github.com/guardian-ai/guardian"

[tool.setuptools.packages.find]
include = ["guardian*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
